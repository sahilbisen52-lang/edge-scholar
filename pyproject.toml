[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "edge-scholar"
version = "0.1.0"
description = "Private On-Device AI Study Copilot for Snapdragon-powered PCs"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "EdgeScholar Contributors" }]

dependencies = [
    "PySide6>=6.7.0",
    "PyMuPDF>=1.24.0",
    "faiss-cpu>=1.8.0",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "tiktoken>=0.7.0",
    "SQLAlchemy>=2.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "python-dotenv>=1.0.0",
    "sounddevice>=0.4.7",
    "scipy>=1.13.0",
    "psutil>=5.9.0",
    "rich>=13.0.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
llama = [
    "llama-cpp-python>=0.2.80",
]
whisper = [
    "openai-whisper>=20231117",
    "torch>=2.3.0",
]
faster-whisper = [
    "faster-whisper>=1.0.0",
]
onnx = [
    "onnxruntime>=1.18.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
    "pytest-cov>=5.0.0",
    "black>=24.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "reportlab>=4.0.0",
]

[project.scripts]
edge-scholar = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
